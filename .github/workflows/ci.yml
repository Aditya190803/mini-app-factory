name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test:ci

      # Placeholders only: the build needs these to be present, not valid.
      # Catches what typecheck cannot, such as a route or metadata file that
      # fails to compile or prerender.
      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://placeholder-123.convex.cloud
          NEXT_PUBLIC_STACK_PROJECT_ID: 00000000-0000-4000-8000-000000000000
          NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY: pck_placeholder
          STACK_SECRET_SERVER_KEY: ssk_placeholder
