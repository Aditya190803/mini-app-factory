name: CI

on:
  push:
    branches:
      - main
  pull_request:

# One run per branch: a new push cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun packages and the Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            .next/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Production dependencies only, at high severity and above. Dev-only tooling advisories
      # (eslint's minimatch/picomatch) are tracked in REQUIREMENTS.md rather than failing builds.
      - name: Audit dependencies
        run: bun audit --prod --audit-level=high

      # Regenerates convex/_generated and fails if it differs from what is committed. Needs a
      # deploy key; skipped on forks and before the secret is configured.
      - name: Check Convex codegen is up to date
        if: ${{ env.CONVEX_DEPLOY_KEY != '' }}
        run: |
          bun x convex codegen
          git diff --exit-code -- convex/_generated

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test with coverage
        run: bun run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      # Placeholders only: the build needs these to be present, not valid.
      # Catches what typecheck cannot, such as a route or metadata file that
      # fails to compile or prerender.
      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://placeholder-123.convex.cloud
          NEXT_PUBLIC_STACK_PROJECT_ID: 00000000-0000-4000-8000-000000000000
          NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY: pck_placeholder
          STACK_SECRET_SERVER_KEY: ssk_placeholder

  # Smoke tests against the production build: public pages, health, robots, headers.
  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_CONVEX_URL: https://placeholder-123.convex.cloud
      NEXT_PUBLIC_STACK_PROJECT_ID: 00000000-0000-4000-8000-000000000000
      NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY: pck_placeholder
      STACK_SECRET_SERVER_KEY: ssk_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
      - run: bun run build
      - run: bun run test:e2e

  # Convex functions ship with the app: deploy them when main changes, after the checks pass.
  deploy-convex:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Deploy Convex functions
        if: ${{ env.CONVEX_DEPLOY_KEY != '' }}
        run: bun x convex deploy
